# Weekly pull requests for outdated Rust crates and GitHub Actions.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]
    commit-message:
      prefix: build   # Conventional Commits: "build(deps): bump …"
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci      # "ci(deps): bump …"
      include: scope

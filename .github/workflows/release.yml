# Builds the app on GitHub and publishes a release.
#
#   Bump `version` in Cargo.toml and add a matching "## [x.y.z]" section to CHANGELOG.md in your PR. When it's merged
#   into main, this creates the tag "vx.y.z" and the release with the exes, checksums and changelog notes.
#   Pushes to main that don't change the version (fixes in progress, Dependabot) release nothing.
#
#   Actions tab -> Release -> "Run workflow" -> test build only; the exes are attached to the run as artifacts.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # needed to create the tag and the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this a new version?
        id: v
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "version=$v-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released; bump the version in Cargo.toml to release again."
            echo "publish=skip" >> "$GITHUB_OUTPUT"
          else
            if ! grep -q "^## \[$v\]" CHANGELOG.md; then
              echo "::error::Cargo.toml says $v but CHANGELOG.md has no '## [$v]' section."
              exit 1
            fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.publish != 'skip'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BM_VERSION: ${{ needs.version.outputs.version }}   # compiled into the exe (tray menu, file properties)
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo test --release --locked

      - name: Build x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build ARM64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Smoke test (the exe starts and can draw icons)
        shell: pwsh
        run: |
          $p = Start-Process target/x86_64-pc-windows-msvc/release/BatteryMonitor.exe -ArgumentList '--preview', "$PWD/preview.bmp" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path preview.bmp)) { throw "BatteryMonitor.exe failed to start (exit $($p.ExitCode))" }

      - name: Collect downloads and release notes
        shell: bash
        run: |
          mkdir release
          cp target/x86_64-pc-windows-msvc/release/BatteryMonitor.exe  "release/BatteryMonitor-${VERSION}-x64.exe"
          cp target/aarch64-pc-windows-msvc/release/BatteryMonitor.exe "release/BatteryMonitor-${VERSION}-arm64.exe"
          (cd release && sha256sum *.exe > SHA256SUMS.txt)
          {
            echo "**Download:** \`BatteryMonitor-${VERSION}-x64.exe\` for almost every PC, or \`-arm64.exe\` for ARM laptops"
            echo "(Snapdragon / Surface Pro X). A single ~0.7 MB file: no installer, nothing else to install. Just run it."
            echo
            echo "Windows will warn that the app is from an unknown publisher (it isn't code-signed):"
            echo "click **More info → Run anyway**. Then see the README for keeping the icon on the taskbar."
            echo
            echo "## Changes"
            # The CHANGELOG section for this version, without its heading.
            awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
          } > release-notes.md

      - name: Upload build (test runs)
        if: needs.version.outputs.publish == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: BatteryMonitor-${{ env.VERSION }}
          path: |
            release/
            release-notes.md

      - name: Create tag and GitHub release
        if: needs.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          files: release/*
          body_path: release-notes.md

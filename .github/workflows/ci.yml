# Formatting, lints, tests and a release build for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test (the exe starts and can draw icons)
        shell: pwsh
        run: |
          $p = Start-Process target/release/BatteryMonitor.exe -ArgumentList '--preview', "$PWD/preview.bmp" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path preview.bmp)) { throw "BatteryMonitor.exe failed to start (exit $($p.ExitCode))" }
